name: March 7th App CI

on:
  push:
    paths:
      - "march-7th-app/**"
      - ".github/workflows/march-7th-app-ci.yml"
  pull_request:
    paths:
      - "march-7th-app/**"
      - ".github/workflows/march-7th-app-ci.yml"
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rust_target: aarch64-apple-darwin
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: march-7th-app

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: march-7th-app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: march-7th-app/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.rust_target }}
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.rust_target }} --all-targets -- -D warnings
      - name: Verify actual cross-process directory locks and exit recovery
        run: node --test scripts/data-directory.node-test.mjs
